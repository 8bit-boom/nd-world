{% extends "base.html" %}
{% block title %}Calendar Settings — {{ world.name if world else 'N&D World' }}{% endblock %}
{% block content %}
<div class="form-page">
  <h1>⚙ Calendar Settings</h1>
  <form method="post" action="/calendar/config" id="cal-config-form" class="entity-form">
    <div class="form-group">
      <label>Era Name</label>
      <input name="era_name" value="{{ config.era_name or '' }}" placeholder="e.g. Year 1, Cycle 447"/>
    </div>
    <div class="form-group">
      <label>Current Day <small>(absolute day count from campaign start)</small></label>
      <input type="number" name="current_day" value="{{ config.current_day or 1 }}" min="1"/>
    </div>

    <div class="form-group">
      <label>Months</label>
      <div id="months-list" style="display:flex;flex-direction:column;gap:.4rem"></div>
      <button type="button" onclick="addMonth()" class="btn-cancel" style="align-self:flex-start;margin-top:.5rem">+ Add Month</button>
      <input type="hidden" name="months_json" id="months-json-input"/>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-save">Save</button>
      <a href="{{ '/calendar'|wq }}" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>

<style>
.month-row { display:grid; grid-template-columns:2fr 100px 32px; gap:.4rem; align-items:center; background:var(--bg2); border:1px solid var(--border); border-radius:4px; padding:.5rem .65rem; }
.month-row input { background:var(--bg3); border:1px solid var(--border); color:var(--text); padding:.3rem .5rem; font-family:var(--font); font-size:.82rem; border-radius:3px; width:100%; }
.month-del { background:none; border:none; color:#c44; font-size:1.1rem; cursor:pointer; padding:0 .1rem; line-height:1; }
</style>

<script>
let _months = {{ config.months | tojson }};

function esc(s) { return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function renderMonths() {
  const list = document.getElementById('months-list');
  list.innerHTML = '';
  _months.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'month-row';
    row.innerHTML = `
      <input type="text" placeholder="Month name" value="${esc(m.name||'')}" oninput="updateMonth(${i},'name',this.value)"/>
      <input type="number" min="1" placeholder="Days" value="${m.days ?? 30}" oninput="updateMonth(${i},'days',this.value)"/>
      <button type="button" class="month-del" onclick="removeMonth(${i})" title="Remove">✕</button>
    `;
    list.appendChild(row);
  });
  syncHidden();
}

function updateMonth(i, key, val) {
  _months[i][key] = key === 'days' ? (parseInt(val, 10) || 1) : val;
  syncHidden();
}
function removeMonth(i) { if (_months.length > 1) { _months.splice(i, 1); renderMonths(); } }
function addMonth() { _months.push({ name: '', days: 30 }); renderMonths(); }

function syncHidden() {
  document.getElementById('months-json-input').value = JSON.stringify(_months);
}

document.getElementById('cal-config-form').addEventListener('submit', syncHidden);
renderMonths();
</script>
{% endblock %}
