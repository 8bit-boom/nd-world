{% extends "base.html" %}
{% block title %}AI Chat — {{ world.name if world else 'N&D World' }}{% endblock %}
{% block content %}
<link rel="stylesheet" href="/static/css/ai-chat.css">
<div class="ai-page">
  <div class="ai-main">
    <div class="ai-messages" id="ai-messages">
      <div class="ai-msg ai-msg--assistant"><div class="ai-bubble">Hi! Ask me anything about {{ world.name if world else 'this world' }} — I'm a general-purpose assistant, not tied to any one entity.</div></div>
    </div>
    <div class="ai-status-row" style="padding:0 1.2rem;font-size:.75rem;color:var(--text-dim)"><span id="ai-stats"></span></div>
    <div class="ai-input-bar">
      <textarea id="ai-input" rows="1" placeholder="Ask something… (Enter to send)" onkeydown="pcKey(event)" oninput="pcResize(this)"></textarea>
      <button id="ai-send" onclick="pcSend()">Send</button>
    </div>
  </div>
</div>
<script>
function _mdToHtml(text) {
  let h = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```[\s\S]*?```/g, m => '<pre><code>' + m.slice(3,-3).replace(/^\w+\n/,'') + '</code></pre>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]+?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
  return '<p>' + h + '</p>';
}
function _escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// GM-authored standing instructions (app.ai_instructions — a per-world
// collection of uploaded .md files, e.g. "always answer in a noir
// detective's voice") — "" when this world has none enabled.
const PC_CUSTOM_INSTRUCTIONS = {{ (ai_custom_instructions or "") | tojson }};
const PC_SYSTEM = (
  "You are a helpful world-building assistant for a tabletop RPG campaign called "
  + {{ (world.name if world else "this world") | tojson }}
  + ". Answer the player's questions helpfully and in a tone that fits the setting. "
  + "You don't have access to any GM-only secrets — answer from general knowledge, "
  + "whatever the player tells you in this conversation, and any \"Relevant world info\" "
  + "provided below (only what this player already has access to). "
  // Same grounding instruction as the GM's own AI Chat (app.main.ai_chat_
  // page's _GROUNDING_CLAUSE) — a player asking "how much does armor cost"
  // is asking what the RULES say, not for a creative riff, so a confident
  // invented answer here is actively misleading rather than harmlessly
  // off-tone the way it might be for a GM brainstorming NPCs.
  + "When asked whether something already exists in this world's rules or lore "
  + "(a trait, an item, a price, a fact), answer only from what the \"Relevant world "
  + "info\" actually says — never invent specific names, numbers, or details to fill "
  + "a gap. If it isn't covered there, say so plainly rather than presenting an "
  + "invented answer as fact. "
  // Real reported failure (see app.main.ai_chat_page's identical addition
  // to _GROUNDING_CLAUSE): asked to list items from a Rules table, a
  // model answered with a vague category/price-range summary instead of
  // the table's actual named rows — grounded in retrieved text, but not
  // what "list the X" was actually asking for.
  + "When the retrieved \"Relevant world info\" includes a markdown table relevant to "
  + "the question, that table IS the answer: list its actual named rows verbatim "
  + "(item names, prices, stats) rather than summarizing them into categories or "
  + "ranges from surrounding overview prose. If a table excerpt says more rows were "
  + "truncated, list every row you were given and say the list continues in the full "
  + "Rules text rather than treating the partial list as complete."
  + (PC_CUSTOM_INSTRUCTIONS ? "\n\n" + PC_CUSTOM_INSTRUCTIONS : "")
);
let pcHistory = [];

// Best-effort lore lookup — same visibility rules /kind/{kind} and
// /entity/{id} already enforce for this player (see
// ai_world_context_player's docstring in app/routers/ai.py), so this can
// only ever surface something the player could already find by browsing.
// Failure here is silent: a player still gets a plain answer with no lore
// grounding rather than a broken chat.
async function pcFetchContext(query) {
  try {
    const res = await fetch('/api/ai/world-context-player', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
    });
    if (!res.ok) return '';
    const data = await res.json();
    return data.context || '';
  } catch (e) { return ''; }
}

function pcResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px'; }
function pcKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); pcSend(); } }

function pcAdd(role, text, thinking) {
  const box = document.getElementById('ai-messages');
  const w = document.createElement('div');
  w.className = 'ai-msg ai-msg--' + role + (thinking ? ' ai-thinking' : '');
  const b = document.createElement('div');
  b.className = 'ai-bubble';
  b.innerHTML = role === 'user' ? _escHtml(text) : (thinking ? text : _mdToHtml(text));
  w.appendChild(b);
  box.appendChild(w);
  box.scrollTop = 99999;
  return b;
}

// The model's live reasoning trace — same pattern (and same shared
// static/css/ai-chat.css classes/.ai-msg--assistant column layout) as the
// GM's main AI Chat page (static/js/ai-chat-core.js's ndEnsureReasoning).
// Inserted as a sibling BEFORE the bubble within the same .ai-msg wrapper,
// since the bubble's own innerHTML gets replaced wholesale every token.
function pcEnsureReasoning(bubble) {
  const w = bubble.parentElement;
  let det = w.querySelector('.ai-reasoning');
  if (!det) {
    det = document.createElement('details');
    det.className = 'ai-reasoning';
    det.open = true;
    const sum = document.createElement('summary');
    sum.textContent = '🧠 Thinking…';
    det.appendChild(sum);
    const pre = document.createElement('div');
    pre.className = 'ai-reasoning-text';
    det.appendChild(pre);
    w.insertBefore(det, bubble);
  }
  return det.querySelector('.ai-reasoning-text');
}

async function pcSend() {
  const inp = document.getElementById('ai-input');
  const btn = document.getElementById('ai-send');
  const statsEl = document.getElementById('ai-stats');
  const text = inp.value.trim();
  if (!text || btn.disabled) return;
  inp.value = ''; pcResize(inp);
  pcAdd('user', text);
  pcHistory.push({ role: 'user', content: text });
  btn.disabled = true;
  const bubble = pcAdd('assistant', '…', true);
  statsEl.textContent = '⏳ Looking up lore…';
  const ctx = await pcFetchContext(text);
  // Same KV-cache-friendly placement ai-chat-core.js uses: the lore pair
  // sits immediately before the newest turn, never at the front, so only
  // it (plus that one new message) ever needs re-prefilling — everything
  // before it stays byte-stable turn to turn. Never pushed into
  // pcHistory itself, so nothing persisted changes.
  const messages = ctx ? [
    ...pcHistory.slice(0, -1),
    { role: 'user', content: 'Relevant world info:\n\n' + ctx },
    { role: 'assistant', content: 'Got it.' },
    ...pcHistory.slice(-1),
  ] : pcHistory;
  statsEl.textContent = '⏳ Connecting…';
  try {
    const res = await fetch('/api/ai/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // think: true by default — same as the GM's main AI Chat page — so a
      // reasoning-capable model actually reasons before answering; a model
      // that doesn't support thinking just falls back transparently
      // server-side (app.ai.stream_chat's own think=false retry).
      body: JSON.stringify({ messages, system: PC_SYSTEM, surface: 'ask_ai', think: true }),
    });
    if (!res.ok) throw new Error('Server error ' + res.status);
    bubble.parentElement.classList.remove('ai-thinking');
    bubble.innerHTML = '';
    let full = '';
    let noteText = '';
    let reasoning = '';
    let reasoningTextEl = null;
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data: ')) continue;
        const pay = p.slice(6);
        if (pay === '[DONE]') break;
        const obj = JSON.parse(pay);
        if (obj.note) {
          noteText = obj.note;
          bubble.innerHTML = `<div style="font-size:.75rem;color:var(--text-dim);margin-bottom:.4rem">ℹ️ ${_escHtml(noteText)}</div>` + _mdToHtml(full);
          continue;
        }
        if (typeof obj.thinking === 'string') {
          reasoning += obj.thinking;
          if (!reasoningTextEl) reasoningTextEl = pcEnsureReasoning(bubble);
          reasoningTextEl.textContent = reasoning;
          document.getElementById('ai-messages').scrollTop = 99999;
          continue;
        }
        if (typeof obj.token !== 'string') continue;
        if (reasoningTextEl) {
          // The real answer is starting — collapse the reasoning trace so
          // it doesn't crowd out the reply, but leave it there to reopen.
          const det = reasoningTextEl.closest('details');
          det.querySelector('summary').textContent = '🧠 Thought process';
          det.open = false;
          reasoningTextEl = null;
        }
        full += obj.token;
        bubble.innerHTML = (noteText ? `<div style="font-size:.75rem;color:var(--text-dim);margin-bottom:.4rem">ℹ️ ${_escHtml(noteText)}</div>` : '') + _mdToHtml(full);
        document.getElementById('ai-messages').scrollTop = 99999;
      }
    }
    statsEl.textContent = '';
    pcHistory.push({ role: 'assistant', content: full });
  } catch (e) {
    statsEl.textContent = '';
    bubble.parentElement.classList.remove('ai-thinking');
    bubble.textContent = 'Error: ' + e.message;
  } finally { btn.disabled = false; inp.focus(); }
}
</script>
{% endblock %}
