{% extends "base.html" %}
{% block title %}New Map — {{ world.name if world else 'N&D World' }}{% endblock %}
{% block content %}
<div class="form-page">
  <h1>🗺 New Map</h1>
  <form method="post" action="/maps/new" class="entity-form" enctype="multipart/form-data">
    <div class="form-group">
      <label>Name *</label>
      <input name="name" required placeholder="e.g. City of Hue, Hughes Station…" autocomplete="off"/>
    </div>
    <div class="form-group">
      <label>Size (pixels)</label>
      <div style="display:flex;gap:.5rem;align-items:center">
        <input type="number" name="width" value="3072" min="200" max="8000" style="width:100px"/>
        <span style="opacity:.5">×</span>
        <input type="number" name="height" value="3072" min="200" max="8000" style="width:100px"/>
      </div>
    </div>
    <div class="form-group">
      <label>Background Image (optional — you can also add/replace it later from the maps list)</label>
      <div id="map-img-dropzone" class="form-dropzone" style="border:1px dashed var(--border);border-radius:4px;padding:.8rem;text-align:center;font-size:.85rem;color:var(--text-dim)">
        <div id="map-img-dropzone-label">Choose a file, or drag&nbsp;&amp;&nbsp;drop an image here</div>
        <input type="file" name="image_file" accept="image/*" style="margin-top:.4rem"/>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Create Map</button>
      <a href="{{ '/maps'|wq }}" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>
<script>
// Same drag&drop pattern as the schematic editor's background drop zone
// (app/templates/schematic.html) and the maps-list upload labels — here it
// just populates the existing file input rather than auto-submitting, since
// this form has other required fields (name) to fill in first.
(function () {
  const zone = document.getElementById('map-img-dropzone');
  const input = zone.querySelector('input[type=file]');
  const label = document.getElementById('map-img-dropzone-label');
  zone.addEventListener('dragenter', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    zone.classList.add('drag-over');
  });
  zone.addEventListener('dragover', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    zone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (!f || !f.type.startsWith('image/')) return;
    input.files = e.dataTransfer.files;
    label.textContent = f.name;
  });
  input.addEventListener('change', () => {
    if (input.files[0]) label.textContent = input.files[0].name;
  });
})();
</script>
{% endblock %}
