<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Join {{ world.name if world else 'World' }} — N&amp;D World</title>
  <link rel="stylesheet" href="/static/style.css?v=5"/>
  <style>
    .auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .auth-card { width:100%; max-width:400px; background:var(--bg2); border:1px solid var(--border);
      border-radius:8px; padding:1.6rem; }
    .auth-logo { text-align:center; font-size:1.2rem; margin-bottom:.3rem; color:var(--neon); }
    .auth-logo span { color:var(--neon2); }
    .auth-sub { text-align:center; font-size:.85rem; color:var(--text-dim); margin-bottom:1.2rem; }
    .auth-field { display:flex; flex-direction:column; gap:.3rem; margin-bottom:.9rem; }
    .auth-field label { font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }
    .auth-field input { background:var(--bg3); border:1px solid var(--border); color:var(--text);
      padding:.5rem .7rem; border-radius:4px; font-family:var(--font); font-size:.9rem; width:100%; box-sizing:border-box; }
    .auth-error { color:var(--neon2); font-size:.82rem; margin-bottom:.9rem; text-align:center; }
    .auth-submit { width:100%; margin-top:.4rem; }
    .auth-toggle { text-align:center; font-size:.8rem; color:var(--text-dim); margin-top:1rem; }
    .auth-toggle a { cursor:pointer; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    {% if error %}
    <div class="auth-card">
      <div class="auth-logo">N&amp;D <span>WORLD</span></div>
      <div class="auth-error">{{ error }}</div>
      <div class="auth-toggle"><a href="/login">Go to sign in</a></div>
    </div>
    {% else %}
    <form class="auth-card" method="post" action="/join/{{ code }}" id="join-form">
      <div class="auth-logo">N&amp;D <span>WORLD</span></div>
      <div class="auth-sub">You've been invited to <strong style="color:var(--text)">{{ world.name }}</strong></div>
      {% if form_error %}<div class="auth-error">{{ form_error }}</div>{% endif %}
      <input type="hidden" name="mode" id="join-mode" value="signup">
      <div class="auth-field" id="display-name-field">
        <label>Your Name</label>
        <input type="text" name="display_name" placeholder="What should we call you?">
      </div>
      <div class="auth-field">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn-primary auth-submit" id="join-submit">Join &amp; Create Account</button>
      <div class="auth-toggle">
        Already have an account? <a onclick="toggleMode()" id="toggle-link">Log in instead</a>
      </div>
    </form>
    {% endif %}
  </div>
  <script>
    function toggleMode() {
      const modeField = document.getElementById('join-mode');
      const nameField = document.getElementById('display-name-field');
      const submit = document.getElementById('join-submit');
      const toggle = document.getElementById('toggle-link');
      const isSignup = modeField.value === 'signup';
      modeField.value = isSignup ? 'login' : 'signup';
      nameField.style.display = isSignup ? 'none' : '';
      submit.textContent = isSignup ? 'Log In & Join' : 'Join & Create Account';
      toggle.textContent = isSignup ? 'New here? Create an account instead' : 'Log in instead';
    }
  </script>
</body>
</html>
