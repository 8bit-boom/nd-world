[package]
name = "nd-gateway"
version = "0.1.0"
edition = "2021"
description = "nd-world gateway: serves static files and uploads, passes everything else to the Python app (docs/RUST_REWRITE_PLAN.md, phase 1)"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
hyper = { version = "1", features = ["http1", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "webpki-tokio", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
bytes = "1"
httpdate = "1"
mime_guess = "2"
percent-encoding = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
base64 = "0.22"
hmac = "0.12"
nd-render = { path = "../nd-render" }
nd-perm = { path = "../nd-perm" }
html-escape = "0.2"
minijinja = "2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false }
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
zip9 = { package = "zip", version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }   # the streamed Full Backup only (ZipWriter::new_stream)
flate2 = "1"
brotli = "9"
mimalloc = { version = "0.1", default-features = false }
dhat = { version = "0.3", optional = true }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }

rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
rand = "0.8"
fancy-regex = "0.14"
regex = "1"
# lore_forge: the Llm-training repo tarball (a tar.gz from GitHub) and its catalog/models.toml
tar = "0.4"
toml = "0.8"
# picture processing (crate::imaging): decoders, the AVIF encoder (pure Rust; no nasm in the image build) and libwebp for lossy WebP
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "avif", "bmp", "tiff"] }
roxmltree = "0.20"   # the SVG allow-list of the prop library (props.rs)
webp = { version = "0.3", default-features = false }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
tempfile = "3"
flate2 = "1"

[features]
# heap profile for a hunt for big allocations: cargo build --release --features dhat-heap; run with ND_DHAT_SECS=<n>, it writes dhat-heap.json after n seconds and exits
dhat-heap = ["dep:dhat"]
