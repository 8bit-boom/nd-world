[package]
name = "nd-render"
version = "0.1.0"
edition = "2021"
description = "Renders the app's own Jinja templates with MiniJinja (docs/RUST_REWRITE_PLAN.md, phase 2)"

[dependencies]
minijinja = { version = "2", features = ["loader", "builtins", "multi_template", "macros", "custom_syntax", "json", "urlencode", "debug", "serde", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
minijinja-contrib = { version = "2", features = ["pycompat"] }
regex = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
fancy-regex = "0.14"
html-escape = "0.2"
nd-perm = { path = "../nd-perm" }
