[package]
name = "nd-render"
version = "0.1.0"
edition = "2021"
description = "Renders the app's own Jinja templates with MiniJinja (docs/RUST_REWRITE_PLAN.md, phase 2)"

[dependencies]
minijinja = { version = "2", features = ["loader", "builtins", "multi_template", "macros", "custom_syntax", "json", "urlencode", "debug", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
