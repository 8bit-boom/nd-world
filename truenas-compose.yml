version: "3.9"

services:
  world:
    image: ghcr.io/8bit-boom/nd-world:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8087:8000"
    volumes:
      - /mnt/DeadPool/apps/nd-world:/data
    environment:
      DB_PATH: /data/world.db
      ND_PYTHON_FREE: "1"
      ND_MODE: rust
      UNSLOTH_URL: ${UNSLOTH_URL:-http://unsloth:8000}
      UNSLOTH_API_KEY: ${UNSLOTH_API_KEY:-}
      UNSLOTH_MODEL: ${UNSLOTH_MODEL:-unsloth/gemma-4-26B-A4B-it-GGUF}
      UNSLOTH_IMAGE_MODEL: ${UNSLOTH_IMAGE_MODEL:-unsloth/z-image-turbo-GGUF}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      GM_EMAIL: ${GM_EMAIL:-}
      GM_PASSWORD: ${GM_PASSWORD:-}
      GM_NAME: ${GM_NAME:-GM}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
