version: "3.9"
services:
  world:
    image: ghcr.io/8bit-boom/nd-world:latest
    restart: unless-stopped
    ports:
      - "8087:8000"
    volumes:
      - /mnt/DeadPool/apps/nd-world:/data
      - /mnt/DeadPool/apps/swarmui/data/Autocompletions:/data/swarmui-ac  # shared with swarmui for native tag autocompletions
    environment:
      DB_PATH: /data/world.db
      # AI chat / image generation are optional (see the "ollama"/"swarmui" Compose
      # profiles below) — nd-world runs fine without them and just shows AI features
      # as unavailable. These URLs only matter if you've enabled those profiles.
      IMAGEGEN_TYPE: swarmui
      IMAGEGEN_URL: http://swarmui:7801
      # Set to http://<truenas-ip>:7801 to enable the Image Studio iframe inside nd-world
      SWARMUI_EXTERNAL_URL: ""
      SWARMUI_AC_DIR: /data/swarmui-ac  # shared bind mount → SwarmUI Data/Autocompletions
      # Set to http://<truenas-ip>:6080 to enable the embedded Android app
      # iframe at /androidapp (see the "android" profile below).
      ANDROID_EMULATOR_URL: ""
      # Set to http://<truenas-ip>:6081 to enable the embedded Content Editor
      # iframe at /editor (see the "editor" profile below).
      EDITOR_EXTERNAL_URL: ""
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma4:26b   # change to whichever model you've pulled
      # Auth — see .env.example. GM_EMAIL/GM_PASSWORD bootstrap the one GM account;
      # everyone else joins as a player via a GM-issued invite link.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — see scripts/setup.sh or .env.example}
      GM_EMAIL: ${GM_EMAIL:-}
      GM_PASSWORD: ${GM_PASSWORD:-}
      GM_NAME: ${GM_NAME:-GM}
      # Set to true once served over HTTPS (e.g. behind a Cloudflare Tunnel) — see docs/DEPLOYMENT.md
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    labels:
      net.ix-portals.nd-world.scheme: "http"
      net.ix-portals.nd-world.port: "8087"
      net.ix-portals.nd-world.path: "/"
      net.ix-portals.nd-world.host: ""
    # No depends_on on swarmui/ollama — both are optional (see profiles below) and
    # the app already degrades gracefully (AI features just show as unavailable)
    # when they aren't running.

  # Optional: local AI image generation. Only starts if the "swarmui" profile is
  # active — set COMPOSE_PROFILES=swarmui (or ollama,swarmui) in .env, or run
  # `docker compose -f truenas-compose.yml --profile swarmui up -d`.
  swarmui:
    profiles: ["swarmui"]
    image: ghcr.io/mcmonkeyprojects/swarmui:latest
    restart: unless-stopped
    ports:
      - "7801:7801"
    volumes:
      - /mnt/DeadPool/apps/swarmui/data:/SwarmUI/Data
      - /mnt/DeadPool/apps/swarmui/models:/SwarmUI/Models
      - /mnt/DeadPool/apps/swarmui/dlbackend:/SwarmUI/dlbackend
    environment:
      SWARMUI_NETWORK_BIND_ADDRESS: "0.0.0.0"
      SWARMUI_NETWORK_PORT: "7801"
    labels:
      net.ix-portals.swarmui.scheme: "http"
      net.ix-portals.swarmui.port: "7801"
      net.ix-portals.swarmui.path: "/"
      net.ix-portals.swarmui.host: ""

  # Optional: local AI chat. Only starts if the "ollama" profile is active —
  # set COMPOSE_PROFILES=ollama (or ollama,swarmui) in .env, or run
  # `docker compose -f truenas-compose.yml --profile ollama up -d`.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /mnt/DeadPool/apps/ollama:/root/.ollama
    labels:
      net.ix-portals.ollama.scheme: "http"
      net.ix-portals.ollama.port: "11434"
      net.ix-portals.ollama.path: "/"
      net.ix-portals.ollama.host: ""
    # To pull a model after first start:
    #   docker compose exec ollama ollama pull gemma4:26b
    # For NVIDIA GPU, uncomment the deploy block below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Optional: embed the real NeonDragonsApp Android UI inside nd-world (see
  # /androidapp) via a self-hosted emulator + noVNC web viewer. Only starts
  # if the "android" profile is active — set COMPOSE_PROFILES=android (or
  # add it to your existing list), or run
  # `docker compose -f truenas-compose.yml --profile android up -d`.
  #
  # Requirements this doesn't check for you: /dev/kvm available on the
  # TrueNAS host (huge performance difference without it — see
  # docs/DEPLOYMENT.md) and a few GB of free RAM. Does NOT run acceptably on
  # ARM-based TrueNAS hardware.
  android:
    profiles: ["android"]
    image: budtmo/docker-android:emulator_11.0
    restart: unless-stopped
    privileged: true   # required by the image to run the emulator (KVM/binder access)
    devices:
      - /dev/kvm
    ports:
      - "6080:6080"
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
    volumes:
      - /mnt/DeadPool/apps/nd-world-android/apk:/apk   # drop the CI-built debug APK here — see scripts/android-provision.sh
    labels:
      net.ix-portals.android.scheme: "http"
      net.ix-portals.android.port: "6080"
      net.ix-portals.android.path: "/"
      net.ix-portals.android.host: ""

  # Optional: embed the real NeonDragonsEditor desktop app inside nd-world
  # (see /editor) via a containerized Xvfb/noVNC session. Only starts if the
  # "editor" profile is active — set COMPOSE_PROFILES=editor (or add it to
  # your existing list), or run
  # `docker compose -f truenas-compose.yml --profile editor up -d`.
  #
  # First-pass, unverified container (no CI coverage) — see
  # docs/DEPLOYMENT.md. The editor has no git integration; use Part 2's
  # "Export to nd-world..." as the primary save path, not this volume.
  editor:
    profiles: ["editor"]
    build: https://github.com/8bit-boom/UoY-Neon-Dragons.git#main:NeonDragonsEditor
    image: nd-editor:latest
    restart: unless-stopped
    ports:
      - "6081:6080"
    volumes:
      - /mnt/DeadPool/apps/nd-world-editor/config:/root/NeonDragonsEditor
      - /mnt/DeadPool/apps/nd-world-editor/rulebook:/data/rulebook
    labels:
      net.ix-portals.editor.scheme: "http"
      net.ix-portals.editor.port: "6081"
      net.ix-portals.editor.path: "/"
      net.ix-portals.editor.host: ""

  # containrrr/watchtower was archived (read-only) in December 2025 — its
  # image stopped receiving updates, so an already-pulled copy drifts further
  # behind every time the host's Docker Engine is upgraded until its
  # bundled API client version falls below what the daemon still accepts
  # ("client version X is too old"). nickfedor/watchtower is the actively
  # maintained community continuation and a drop-in replacement (same image
  # name/flags otherwise) — see https://github.com/nicholas-fedor/watchtower.
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
