version: "3.9"
services:
  world:
    image: ghcr.io/8bit-boom/nd-world:latest
    restart: unless-stopped
    # See docker-compose.yml's identical setting for the full budget
    # breakdown — a clean shutdown needs room to checkpoint in-flight
    # background jobs (app/job_shutdown.py) before TrueNAS/Docker escalates
    # to SIGKILL.
    stop_grace_period: 30s
    ports:
      - "8087:8000"
    volumes:
      - /mnt/DeadPool/apps/nd-world:/data
      - /mnt/DeadPool/apps/swarmui/data/Autocompletions:/data/swarmui-ac  # shared with swarmui for native tag autocompletions
      - /mnt/DeadPool/apps/whisper:/data/whisper-models  # shared with whisper — lets nd-world download a model file into the same place the "whisper" service loads from
      - /mnt/DeadPool/apps/swarmui/models:/data/swarmui-models  # shared with swarmui's own /SwarmUI/Models mount below — lets nd-world download a checkpoint/VAE/text-encoder into the same place SwarmUI loads from
      - /mnt/DeadPool/apps/nd-world-ollama-config:/data/ollama-config  # shared with ollama — lets Settings > System > "Ollama server tuning" write ollama.env for the "ollama" service's entrypoint to pick up on its next restart, without editing this file
    environment:
      DB_PATH: /data/world.db
      # AI chat / image generation are optional (see the "ollama"/"swarmui" Compose
      # profiles below) — nd-world runs fine without them and just shows AI features
      # as unavailable. These URLs only matter if you've enabled those profiles.
      IMAGEGEN_TYPE: swarmui
      IMAGEGEN_URL: http://swarmui:7801
      # Set to http://<truenas-ip>:7801 to enable the Image Studio iframe inside nd-world
      SWARMUI_EXTERNAL_URL: ""
      SWARMUI_AC_DIR: /data/swarmui-ac  # shared bind mount → SwarmUI Data/Autocompletions
      SWARMUI_MODELS_DIR: /data/swarmui-models  # shared bind mount → SwarmUI's own /SwarmUI/Models, for in-app checkpoint/VAE/text-encoder downloads
      # Set to http://<truenas-ip>:6080 to enable the embedded Android app
      # iframe at /androidapp (see the "android" profile below).
      ANDROID_EMULATOR_URL: ""
      # Set to http://<truenas-ip>:6081 to enable the embedded Content Editor
      # iframe at /editor (see the "editor" profile below).
      EDITOR_EXTERNAL_URL: ""
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma4:26b   # change to whichever model you've pulled
      OLLAMA_CONFIG_DIR: /data/ollama-config   # shared bind mount → the "ollama" service's own config dir below
      WHISPER_URL: http://whisper:8080
      WHISPER_MODELS_DIR: /data/whisper-models
      WHISPER_MODEL_FILE: ggml-large-v3-turbo.bin   # must match the "whisper" service's own -m filename below
      # Auth — see .env.example. GM_EMAIL/GM_PASSWORD bootstrap the one GM account;
      # everyone else joins as a player via a GM-issued invite link.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — see scripts/setup.sh or .env.example}
      GM_EMAIL: ${GM_EMAIL:-}
      GM_PASSWORD: ${GM_PASSWORD:-}
      GM_NAME: ${GM_NAME:-GM}
      # Set to true once served over HTTPS (e.g. behind a Cloudflare Tunnel) — see docs/DEPLOYMENT.md
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    labels:
      net.ix-portals.nd-world.scheme: "http"
      net.ix-portals.nd-world.port: "8087"
      net.ix-portals.nd-world.path: "/"
      net.ix-portals.nd-world.host: ""
    # No depends_on on swarmui/ollama — both are optional (see profiles below) and
    # the app already degrades gracefully (AI features just show as unavailable)
    # when they aren't running.

  # Optional: local AI image generation. Only starts if the "swarmui" profile is
  # active — set COMPOSE_PROFILES=swarmui (or ollama,swarmui) in .env, or run
  # `docker compose -f truenas-compose.yml --profile swarmui up -d`.
  swarmui:
    profiles: ["swarmui"]
    image: ghcr.io/mcmonkeyprojects/swarmui:latest
    restart: unless-stopped
    ports:
      - "7801:7801"
    volumes:
      - /mnt/DeadPool/apps/swarmui/data:/SwarmUI/Data
      - /mnt/DeadPool/apps/swarmui/models:/SwarmUI/Models
      - /mnt/DeadPool/apps/swarmui/dlbackend:/SwarmUI/dlbackend
    environment:
      SWARMUI_NETWORK_BIND_ADDRESS: "0.0.0.0"
      SWARMUI_NETWORK_PORT: "7801"
    labels:
      net.ix-portals.swarmui.scheme: "http"
      net.ix-portals.swarmui.port: "7801"
      net.ix-portals.swarmui.path: "/"
      net.ix-portals.swarmui.host: ""

  # Optional: local AI chat. Only starts if the "ollama" profile is active —
  # set COMPOSE_PROFILES=ollama (or ollama,swarmui) in .env, or run
  # `docker compose -f truenas-compose.yml --profile ollama up -d`.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    # Server-level tuning — controls the Ollama process itself, needs a
    # container restart to take effect. As of the ollama-config bind mount +
    # entrypoint below, you no longer have to edit this file (or restart
    # anything by hand) to change them: Settings > System > "Ollama server
    # tuning" in nd-world writes an ollama.env into that shared mount, and
    # this service's entrypoint sources it on every start/restart, where it
    # WINS over the environment vars below — those still work exactly as
    # before and now just act as the pre-GM-interaction default. All
    # optional; unset any you don't need. See .env.example for defaults, and
    # nd-world's own Settings > System tab for the separate per-request
    # options (temperature etc.) that don't need a restart.
    environment:
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-}
      OLLAMA_LOAD_TIMEOUT: ${OLLAMA_LOAD_TIMEOUT:-}
      OLLAMA_GPU_OVERHEAD: ${OLLAMA_GPU_OVERHEAD:-}
      OLLAMA_SCHED_SPREAD: ${OLLAMA_SCHED_SPREAD:-}
      OLLAMA_DEBUG: ${OLLAMA_DEBUG:-}
      OLLAMA_IGPU_ENABLE: ${OLLAMA_IGPU_ENABLE:-}
      OLLAMA_VULKAN: ${OLLAMA_VULKAN:-}
      # AMD (ROCm) GPU selection — e.g. an RX 9070 XT is gfx1201, natively
      # supported on Linux via ROCm 7+, no HSA_OVERRIDE_GFX_VERSION needed.
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-}
      ROCR_VISIBLE_DEVICES: ${ROCR_VISIBLE_DEVICES:-}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-}
    volumes:
      - /mnt/DeadPool/apps/ollama:/root/.ollama
      - /mnt/DeadPool/apps/nd-world-ollama-config:/ollama-config  # shared with world — see docs/DEPLOYMENT.md and the entrypoint below
    # entrypoint/command source ollama.env (if nd-world has ever saved one)
    # into this process's environment before ollama itself starts, then
    # stamp a copy as ollama.env.applied so nd-world's Settings page can
    # honestly report whether a restart is still pending. See
    # docker-compose.yml's identical block for the full explanation of each
    # part of this script.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /ollama-config &&
        if [ -f /ollama-config/ollama.env ]; then set -a; . /ollama-config/ollama.env; set +a; fi &&
        cp -f /ollama-config/ollama.env /ollama-config/ollama.env.applied 2>/dev/null ||
        printf '# nd-world has not saved any server tuning yet.\n' > /ollama-config/ollama.env.applied;
        exec ollama serve
    labels:
      net.ix-portals.ollama.scheme: "http"
      net.ix-portals.ollama.port: "11434"
      net.ix-portals.ollama.path: "/"
      net.ix-portals.ollama.host: ""
    # To pull a model after first start:
    #   docker compose exec ollama ollama pull gemma4:26b
    # For NVIDIA GPU, uncomment the deploy block below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # For an AMD GPU (ROCm) — e.g. an RX 9070 XT — uncomment this instead.
    # Requires ROCm-capable kernel drivers on the TrueNAS host; the
    # container itself needs no ROCm install (ollama/ollama's default image
    # already bundles it).
    # devices:
    #   - /dev/kfd
    #   - /dev/dri
    # group_add:
    #   - video
    #   - render

  # Optional: transcribe an audio file attached to an AI chat message into
  # text (see /ai and an entity's "Ask AI" panel), using a self-hosted
  # whisper.cpp server — works with any chat model, not just an audio-native
  # one, since the model only ever sees the transcript as plain text. Only
  # starts if the "whisper" profile is active — set COMPOSE_PROFILES=whisper
  # (or add it to your existing list), or run
  # `docker compose -f truenas-compose.yml --profile whisper up -d`.
  #
  # Get a model file the easy way: start this profile once, log in as the
  # GM, and use the "⬇ Download Whisper Model" button on the AI page's
  # Models tab — nd-world downloads whisper-large-v3-turbo (a good default:
  # most of large-v3's accuracy, several times faster, small enough to run
  # acceptably on CPU) straight into /mnt/DeadPool/apps/whisper/. Or
  # download one yourself (a ggml-*.bin file from ggerganov/whisper.cpp —
  # see below; the GGUF format used elsewhere in the ggml ecosystem isn't
  # supported by this image's whisper-server yet)
  # into that same folder and set WHISPER_MODEL_FILE in .env to its exact
  # filename if you'd rather pick a different one. Either way, restart this
  # "whisper" service once afterward to load it.
  whisper:
    profiles: ["whisper"]
    image: ghcr.io/ggml-org/whisper.cpp:main
    # If this crash-loops with "Illegal instruction" in the container's logs
    # (exit code 132) right after the model finishes loading, your CPU
    # doesn't support AVX-512 — the prebuilt image above is compiled
    # assuming whatever instruction set its GitHub Actions build runner
    # happened to have, which silently includes AVX-512 on many runners even
    # though it's not required for good CPU performance. Comment out the
    # `image:` line above and uncomment this `build:` instead — it compiles
    # whisper-server from source with AVX-512 excluded, which fixes it on
    # any x86_64 CPU from roughly the last decade. See
    # docker/whisper/Dockerfile (in the nd-world repo) for the full
    # explanation and https://github.com/ggml-org/whisper.cpp/issues/2928
    # for the upstream bug.
    # build: https://github.com/8bit-boom/nd-world.git#main:docker/whisper
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - /mnt/DeadPool/apps/whisper:/models
    # --convert transcodes whatever format was uploaded (mp3, ogg, m4a, ...)
    # via the ffmpeg already bundled in this image, so nd-world doesn't need
    # to send WAV specifically. --host must be 0.0.0.0, not the image
    # example's default 127.0.0.1, so nd-world's own container can reach it
    # over the Compose network.
    #
    # entrypoint/command together run this as `sh -c "<script>"` so a shell
    # can pick which model to load: prefer the active-model.txt marker file
    # nd-world writes into this same volume (see app.ai.
    # set_active_whisper_model — the GM clicks "★ Make active" on the AI
    # page's Whisper tab), falling back to WHISPER_MODEL_FILE for a fresh
    # deployment where no marker has been written yet. `exec` at the front
    # so whisper-server (not the shell) is PID 1 and gets signals directly —
    # otherwise restarting would wait out the shell's term-signal grace
    # period instead of killing whisper-server right away. The whole script
    # is ONE `command:` list item, not a bare scalar string, specifically to
    # avoid Compose word-splitting it into separate argv entries — combined
    # with a plain `sh -c` entrypoint, which only treats its very first
    # argument as the script to run, a word-split command would silently
    # turn every flag after "exec whisper-server" into an unused $1/$2/...
    # instead of actually reaching the binary. (See docker-compose.yml's
    # identical comment/docs/DEPLOYMENT.md for the full explanation.)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec whisper-server --host 0.0.0.0 --port 8080 --convert
        -m "/models/$(cat /models/active-model.txt 2>/dev/null || echo '${WHISPER_MODEL_FILE:-ggml-large-v3-turbo.bin}')"
    labels:
      net.ix-portals.whisper.scheme: "http"
      net.ix-portals.whisper.port: "8080"
      net.ix-portals.whisper.path: "/"
      net.ix-portals.whisper.host: ""
    # For NVIDIA GPU, use ghcr.io/ggml-org/whisper.cpp:main-cuda above instead
    # and uncomment the deploy block below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Optional: embed the real NeonDragonsApp Android UI inside nd-world (see
  # /androidapp) via a self-hosted emulator + noVNC web viewer. Only starts
  # if the "android" profile is active — set COMPOSE_PROFILES=android (or
  # add it to your existing list), or run
  # `docker compose -f truenas-compose.yml --profile android up -d`.
  #
  # Requirements this doesn't check for you: /dev/kvm available on the
  # TrueNAS host (huge performance difference without it — see
  # docs/DEPLOYMENT.md) and a few GB of free RAM. Does NOT run acceptably on
  # ARM-based TrueNAS hardware.
  android:
    profiles: ["android"]
    image: budtmo/docker-android:emulator_11.0
    restart: unless-stopped
    privileged: true   # required by the image to run the emulator (KVM/binder access)
    devices:
      - /dev/kvm
    ports:
      - "6080:6080"
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
    volumes:
      - /mnt/DeadPool/apps/nd-world-android/apk:/apk   # drop the CI-built debug APK here — see scripts/android-provision.sh
    labels:
      net.ix-portals.android.scheme: "http"
      net.ix-portals.android.port: "6080"
      net.ix-portals.android.path: "/"
      net.ix-portals.android.host: ""

  # Optional: embed the real NeonDragonsEditor desktop app inside nd-world
  # (see /editor) via a containerized Xvfb/noVNC session. Only starts if the
  # "editor" profile is active — set COMPOSE_PROFILES=editor (or add it to
  # your existing list), or run
  # `docker compose -f truenas-compose.yml --profile editor up -d`.
  #
  # First-pass, unverified container (no CI coverage) — see
  # docs/DEPLOYMENT.md. The editor has no git integration; use Part 2's
  # "Export to nd-world..." as the primary save path, not this volume.
  editor:
    profiles: ["editor"]
    build: https://github.com/8bit-boom/UoY-Neon-Dragons.git#main:NeonDragonsEditor
    image: nd-editor:latest
    restart: unless-stopped
    ports:
      - "6081:6080"
    volumes:
      - /mnt/DeadPool/apps/nd-world-editor/config:/root/NeonDragonsEditor
      - /mnt/DeadPool/apps/nd-world-editor/rulebook:/data/rulebook
    labels:
      net.ix-portals.editor.scheme: "http"
      net.ix-portals.editor.port: "6081"
      net.ix-portals.editor.path: "/"
      net.ix-portals.editor.host: ""

  # containrrr/watchtower was archived (read-only) in December 2025 — its
  # image stopped receiving updates, so an already-pulled copy drifts further
  # behind every time the host's Docker Engine is upgraded until its
  # bundled API client version falls below what the daemon still accepts
  # ("client version X is too old"). nickfedor/watchtower is the actively
  # maintained community continuation and a drop-in replacement (same image
  # name/flags otherwise) — see https://github.com/nicholas-fedor/watchtower.
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
