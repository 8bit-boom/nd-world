# ── NVIDIA GPU override for nd-world's bundled AI stack ─────────────────────
#
# Layer ON TOP of the main compose file to give the "ollama" and "swarmui"
# (and GPU whisper) services an NVIDIA GPU, plus minimal (nvidia-smi-only)
# access to nd-world's own container so its hardware detector can see the
# real card:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# TrueNAS SCALE users: don't use this file — assign the GPU from the app's
# Resources/GPU screen instead, or uncomment the matching blocks in
# truenas-compose.yml if you deployed via a pasted-YAML Custom App (see
# docs/GPU_SETUP.md §TrueNAS).
#
# Host prerequisites (full walkthrough: docs/GPU_SETUP.md):
#   - NVIDIA driver 550 or newer (the 580 branch is the LAST to support
#     Volta cards like the V100 — see the guide before ever upgrading past it)
#   - nvidia-container-toolkit installed and the "nvidia" runtime registered
#
# Volta (V100) owners: CUDA 13 dropped Volta. Current Ollama images still
# ship CUDA 12 and work fine; if a future update stops seeing your GPU,
# pin the last CUDA 12 tag (e.g. image: ollama/ollama:0.12.x) instead of
# tracking :latest — details in docs/GPU_SETUP.md.
#
# One V100 running BOTH ollama and swarmui: the reservations below just
# grant each container full access to the same physical card — CUDA lets
# multiple processes share one GPU, but VRAM is still one shared 16/32 GB
# pool between whatever chat model is loaded and whatever image checkpoint
# SwarmUI has resident. See docs/GPU_SETUP.md §3a for sizing guidance if
# you hit CUDA out-of-memory errors running both at once.

services:
  ollama:
    image: ollama/ollama:latest   # V100 owners: pin here if a CUDA 13 update breaks it
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # SwarmUI's bundled ComfyUI/PyTorch backend is installed at first-run (not
  # baked into the image — see README's "performs a first-run setup on
  # initial boot" note), so unlike Ollama there's no single CUDA version to
  # call out here: whatever PyTorch build that installer picks is what you
  # get. Volta (sm_70/V100) has remained inside PyTorch's default compiled
  # compute-capability set for a long time, so this should just work — but
  # if a future SwarmUI update ever installs a PyTorch build that drops it,
  # the failure mode is the same as Ollama's CUDA-13 case (silently stops
  # seeing the GPU): check the SwarmUI container's startup logs for CUDA
  # errors after any update, and pin the image tag below once you've
  # confirmed a version works.
  swarmui:
    image: ghcr.io/mcmonkeyprojects/swarmui:latest   # V100 owners: pin here if a future backend install breaks it
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # nd-world's own app container never runs AI inference itself (it talks
  # to Ollama over HTTP) — this block is scoped to the `utility` capability
  # ONLY (not `compute`), so it grants just enough for `nvidia-smi` to work
  # inside the container, letting Settings > System > "Detected hardware"
  # auto-detect your real card instead of falling back to a GM-entered VRAM
  # override or hardware preset. It never gets a real CUDA context.
  world:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility

  # Optional: GPU-accelerated Whisper transcription. Uncomment to switch
  # the whisper service from CPU to CUDA (requires the whisper profile:
  # COMPOSE_PROFILES=whisper in .env).
  #
  # V100 (Volta, sm_70) owners: the prebuilt ghcr.io/ggml-org/whisper.cpp:
  # main-cuda image does NOT work here — its own build only targets
  # CMAKE_CUDA_ARCHITECTURES='75;80;86;90' (Turing and newer), skipping
  # Volta entirely, so whisper-server never finds a usable GPU kernel on
  # this card. Build the bundled Volta-targeted image instead — that's
  # what's uncommented below (see docker/whisper-cuda/Dockerfile and
  # docs/GPU_SETUP.md §6). Turing-or-newer owners can skip the build and
  # use `image: ghcr.io/ggml-org/whisper.cpp:main-cuda` instead — faster
  # to pull, no reason to build from source on those cards.
  #whisper:
  #  build: ./docker/whisper-cuda
  #  deploy:
  #    resources:
  #      reservations:
  #        devices:
  #          - driver: nvidia
  #            count: all
  #            capabilities: [gpu]
