name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The image runs Python 3.13 (Dockerfile), so the tests that gate it do too (same as tests.yml).
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # the bundled maps' thumbnails, made once (as the image build does) - otherwise every test worker's app makes them at startup,
      # all at once, and the big map pictures run the runner out of memory
      - name: Thumbnails of the bundled pictures
        run: python -m app.static_thumbs
      - name: Run tests
        run: python -m pytest tests/ -q -n auto --dist loadgroup

  build-and-push:
    needs: test
    # Only push on a real merge to main (or a manual dispatch) — a PR from a
    # fork doesn't have package-write access to GITHUB_TOKEN, and PR code
    # shouldn't be published as :latest before it's reviewed either way. The
    # test job above still runs for PRs, so a broken build is still caught.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Required for the cache-from/cache-to: type=gha below — that cache
      # exporter only works on the "docker-container" buildx driver, not
      # the plain "docker" driver build-push-action falls back to without
      # this step (which fails outright with "buildx failed with: ...
      # build-cache-backends" the moment a step tries to use it).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest-denoise was the whisper.cpp "speech enhancement" variant. That variant is gone, but
      # deployments (TrueNAS apps, Watchtower) that were pinned to it would otherwise stay on the last image
      # built under that name forever, so the tag now follows :latest. Safe to drop once nobody uses it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest-denoise
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # How big the image is, layer by layer (docs/LEFTOVERS_PLAN.md, step 1): written to the job summary and the log on every build, so a
      # growing layer (ffmpeg, the pip install, static/, the prebuilt map tiles) is visible and decisions like a slimmer ffmpeg rest on numbers.
      - name: Report image size
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
        run: |
          docker pull -q "$IMAGE"
          size=$(docker image inspect -f '{{.Size}}' "$IMAGE")
          {
            echo "### Image size: $((size / 1000000)) MB (uncompressed)"
            echo
            echo "| Layer size | Created by |"
            echo "|---:|---|"
            docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' "$IMAGE" | grep -v '^0B' \
              | awk -F'\t' '{ c=$2; gsub(/\|/, "\\|", c); if (length(c) > 160) c = substr(c, 1, 160) "..."; printf "| %s | `%s` |\n", $1, c }'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The image's own ffmpeg (a pinned static build - see the Dockerfile) runs and has the encoders the app uses.
      - name: Check ffmpeg in the image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
        run: |
          docker run --rm "$IMAGE" ffprobe -version | head -1
          enc=$(docker run --rm "$IMAGE" ffmpeg -hide_banner -encoders)
          for e in libsvtav1 libopus libmp3lame libx264; do echo "$enc" | grep -q " $e " || { echo "missing encoder $e"; exit 1; }; done
          docker run --rm -e DB_PATH=/tmp/smoke.db -e SECRET_KEY=ci-smoke-check-not-a-real-secret-0000 "$IMAGE" python -c "import app.main" && echo "app imports"

  # The Python-free image (Dockerfile.gateway, docs/PYTHON_FREE_IMAGE_BUILD.md): the Rust gateway alone, no Python at run time. Published under its OWN
  # package name (<repo>-gateway), never as a tag of the normal image, so a deployment that follows :latest of the normal image (Watchtower on TrueNAS)
  # is not moved onto it by accident - pointing an app at this one is a deliberate choice.
  build-and-push-gateway:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # loaded into the local Docker first, so the smoke test below runs BEFORE anything is pushed
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      - name: Report image size
        run: |
          size=$(docker image inspect -f '{{.Size}}' "$IMAGE_NAME:${{ github.sha }}")
          echo "### Python-free image size: $((size / 1000000)) MB (uncompressed)" | tee -a "$GITHUB_STEP_SUMMARY"

      # the pinned static ffmpeg has what the gateway shells out to: the AV1 decoder (AVIF pictures), the AV1 / Opus / H.264 encoders (video upload conversion)
      - name: Check ffmpeg in the image
        run: |
          dec=$(docker run --rm --entrypoint ffmpeg "$IMAGE_NAME:${{ github.sha }}" -hide_banner -decoders)
          echo "$dec" | grep -q " libdav1d " || { echo "missing decoder libdav1d"; exit 1; }
          enc=$(docker run --rm --entrypoint ffmpeg "$IMAGE_NAME:${{ github.sha }}" -hide_banner -encoders)
          for e in libsvtav1 libopus libx264; do echo "$enc" | grep -q " $e " || { echo "missing encoder $e"; exit 1; }; done

      # a real boot on an empty volume: the schema and seed rows made by the gateway itself, the seeded GM signing in, the pages that need no Python,
      # and a request only Python could answer getting the plain "not in this image" answer instead of hanging
      - name: Smoke test (boots, signs in, serves pages)
        run: |
          docker run -d --name nd-pf -p 8000:8000 \
            -e SECRET_KEY=ci-smoke-check-not-a-real-secret-0000 -e GM_EMAIL=gm@example.org -e GM_PASSWORD=ci-smoke-password-1 \
            "$IMAGE_NAME:${{ github.sha }}"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/__gateway/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/__gateway/health || { docker logs nd-pf; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:8000/login || { docker logs nd-pf; exit 1; }
          curl -s -c /tmp/jar -o /dev/null -w '%{http_code}\n' -d "email=gm@example.org&password=ci-smoke-password-1&next=/" http://127.0.0.1:8000/login | grep -q 303 \
            || { echo "sign-in failed"; docker logs nd-pf; exit 1; }
          for p in / /maps /dice /settings /worlds /characters /api/me; do
            code=$(curl -s -b /tmp/jar -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || { echo "$p did not answer 200"; docker logs nd-pf; exit 1; }
          done
          code=$(curl -s -b /tmp/jar -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/openapi.json)
          [ "$code" = "501" ] || { echo "/openapi.json answered $code, expected the 501 'not in this image'"; exit 1; }
          docker rm -f nd-pf

      - name: Push
        run: |
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
