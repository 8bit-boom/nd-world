name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    needs: test
    # Only push on a real merge to main (or a manual dispatch) — a PR from a
    # fork doesn't have package-write access to GITHUB_TOKEN, and PR code
    # shouldn't be published as :latest before it's reviewed either way. The
    # test job above still runs for PRs, so a broken build is still caught.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Required for the cache-from/cache-to: type=gha below — that cache
      # exporter only works on the "docker-container" buildx driver, not
      # the plain "docker" driver build-push-action falls back to without
      # this step (which fails outright with "buildx failed with: ...
      # build-cache-backends" the moment a step tries to use it).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same image, built with the optional DeepFilterNet speech-enhancement
      # dependencies baked in (see Dockerfile's INSTALL_DENOISE arg) — a
      # separate tag rather than the default, since torch/torchaudio/
      # deepfilternet add hundreds of MB and a Rust compile step that most
      # deployments don't need. Lets a deployment that DOES want denoise
      # (e.g. one built with `docker compose build --build-arg
      # INSTALL_DENOISE=true`, bypassing the registry and Watchtower
      # entirely) instead track this tag directly and get automatic
      # updates. Shares the same cache scope as the step above — every
      # layer up to the INSTALL_DENOISE conditional RUN is identical
      # between the two variants, so only the denoise-specific layers and
      # the final app-code layers actually rebuild here.
      - name: Build and push (denoise variant)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: INSTALL_DENOISE=true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest-denoise
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}-denoise
          cache-from: type=gha
          cache-to: type=gha,mode=max
