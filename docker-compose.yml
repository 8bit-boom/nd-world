version: "3.9"

services:
  world:
    build: .
    image: nd-world:latest
    container_name: nd-world
    restart: unless-stopped
    # Budget for a clean shutdown to checkpoint in-flight background jobs
    # (see app/job_shutdown.py) before Docker sends SIGKILL: up to ~10s for
    # uvicorn's own connection drain (Dockerfile's --timeout-graceful-shutdown)
    # + up to ND_JOB_STOP_GRACE_SECONDS (5s default, see .env.example) for a
    # job to reach a checkpoint boundary + a few seconds for cancelled
    # tasks' own cleanup to run and commit. The default 10s stop_grace_period
    # is NOT enough once the Dockerfile flag above is in place.
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - nd-world-data:/data
      - swarmui-ac:/data/swarmui-ac   # shared with swarmui for native tag autocompletions
      - ${AI_MODELS_DIR:-./ai-models}/swarmui:/data/swarmui-models   # shared with swarmui's own Models mount below — lets nd-world download a checkpoint/VAE/text-encoder straight into SwarmUI's model folders
      - ollama-config:/data/ollama-config   # shared with ollama — lets Settings > System > "Ollama server tuning" write ollama.env for the "ollama" service's entrypoint to pick up on its next restart, without editing this file
    environment:
      DB_PATH: /data/world.db
      # AI chat / image generation are optional (see the "ollama"/"swarmui" Compose
      # profiles below) — nd-world runs fine without them and just shows AI features
      # as unavailable. These URLs only matter if you've enabled those profiles.
      IMAGEGEN_TYPE: swarmui
      IMAGEGEN_URL: http://swarmui:7801
      SWARMUI_EXTERNAL_URL: ""   # set to http://<your-host>:7801 to enable the Image Studio iframe
      SWARMUI_AC_DIR: /data/swarmui-ac  # shared volume → SwarmUI Data/Autocompletions
      SWARMUI_MODELS_DIR: /data/swarmui-models  # shared volume → SwarmUI's own /SwarmUI/Models mount below, for in-app checkpoint/VAE/text-encoder downloads
      # Set to http://<your-host>:6080 to enable the embedded Android app
      # iframe at /androidapp (see the "android" profile below).
      ANDROID_EMULATOR_URL: ""
      # Set to http://<your-host>:6081 to enable the embedded Content Editor
      # iframe at /editor (see the "editor" profile below).
      EDITOR_EXTERNAL_URL: ""
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma4:26b   # change to whichever model you've pulled
      OLLAMA_CONFIG_DIR: /data/ollama-config   # shared volume → the "ollama" service's own config dir below
      # Unsloth Studio — the single AI backend (chat + embeddings + image gen)
      # for the "unsloth" profile below, replacing ollama+swarmui. Chat works
      # the moment the key is set; without it nd-world shows AI features as
      # unavailable, same as before. UNSLOTH_API_KEY must be created in the
      # Studio UI once (does NOT survive container recreation — see the
      # "unsloth" service comment below). Enable Studio's "Model auto-switch"
      # so requesting a model by name loads it on demand.
      UNSLOTH_URL: http://unsloth:8000
      UNSLOTH_API_KEY: ${UNSLOTH_API_KEY:-}
      UNSLOTH_MODEL: ${UNSLOTH_MODEL:-unsloth/gemma-4-26B-A4B-it-GGUF}
      UNSLOTH_IMAGE_MODEL: ${UNSLOTH_IMAGE_MODEL:-unsloth/z-image-turbo-GGUF}
      # Auth — see .env.example. GM_EMAIL/GM_PASSWORD bootstrap the one GM account;
      # everyone else joins as a player via a GM-issued invite link.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — see scripts/setup.sh or .env.example}
      GM_EMAIL: ${GM_EMAIL:-}
      GM_PASSWORD: ${GM_PASSWORD:-}
      GM_NAME: ${GM_NAME:-GM}
      # Set to true once served over HTTPS (e.g. behind a Cloudflare Tunnel) — see docs/DEPLOYMENT.md
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # No depends_on on swarmui/ollama — both are optional (see profiles below) and
    # the app already degrades gracefully (AI features just show as unavailable)
    # when they aren't running.

  # Optional: local AI chat. Only starts if the "ollama" profile is active —
  # set COMPOSE_PROFILES=ollama (or ollama,swarmui) in .env, or run
  # `docker compose --profile ollama up -d`.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    # Server-level tuning — these control the Ollama process itself and need
    # a container restart to take effect. As of the ollama-config volume +
    # entrypoint below, you no longer have to edit this file (or restart
    # anything by hand) to change them: Settings > System > "Ollama server
    # tuning" in nd-world writes an ollama.env into that shared volume, and
    # this service's entrypoint sources it on every start/restart, where it
    # WINS over the environment vars below — those still work exactly as
    # before and now just act as the pre-GM-interaction default (e.g. a
    # value you set once here, or leaving a field blank on the Settings
    # page to fall back to it). All optional; unset any you don't need. See
    # .env.example for defaults and
    # https://github.com/ollama/ollama/blob/main/docs/faq.md for more.
    environment:
      # f16 (default, most VRAM), q8_0, or q4_0 (least VRAM, some quality
      # loss) — only takes effect with flash attention on.
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-}
      # How many requests one loaded model serves concurrently.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-}
      # How many different models can be loaded into VRAM at once.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-}
      # How long an idle model stays loaded before being evicted, e.g. 5m,
      # 1h, -1 (forever), 0 (unload immediately after each request).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
      # Default context window size in tokens, if a request doesn't set its
      # own num_ctx (see nd-world's own Settings > System tab).
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-}
      OLLAMA_LOAD_TIMEOUT: ${OLLAMA_LOAD_TIMEOUT:-}
      OLLAMA_GPU_OVERHEAD: ${OLLAMA_GPU_OVERHEAD:-}
      OLLAMA_SCHED_SPREAD: ${OLLAMA_SCHED_SPREAD:-}
      OLLAMA_DEBUG: ${OLLAMA_DEBUG:-}
      OLLAMA_IGPU_ENABLE: ${OLLAMA_IGPU_ENABLE:-}
      OLLAMA_VULKAN: ${OLLAMA_VULKAN:-}
      # AMD (ROCm) GPU selection — e.g. an RX 9070 XT is gfx1201, natively
      # supported on Linux via ROCm 7+, no HSA_OVERRIDE_GFX_VERSION needed.
      # Leave blank on NVIDIA/CPU-only hosts.
      #
      # These three are deliberately NOT listed here with a `${VAR:-}`
      # default the way the OLLAMA_* vars above are: Compose's `environment:`
      # map always sets the key inside the container once it's listed at
      # all, even when the substitution is empty — and CUDA specifically
      # treats an explicitly-set-but-EMPTY CUDA_VISIBLE_DEVICES as "zero
      # GPUs visible", not "unset/use the default of every GPU". A host that
      # never touches these three in .env would otherwise silently run
      # Ollama on CPU even with a correctly reserved/passed-through GPU.
      # Set them (if you ever need to, e.g. to pick a card on a multi-GPU
      # host) via Settings > System > "Ollama server tuning" in nd-world
      # instead — that mechanism already gets this right (a blank field
      # omits the var entirely rather than writing it empty) and its
      # ollama.env WINS over anything set here regardless.
    volumes:
      # Same parent directory as swarmui's model volume below (see
      # AI_MODELS_DIR) — not because Ollama and SwarmUI can read each
      # other's model files (they can't; totally different formats), but so
      # every downloaded model — text or image — lives under one directory
      # tree you can point at existing models, back up, or browse as a unit.
      - ${AI_MODELS_DIR:-./ai-models}/ollama:/root/.ollama
      - ollama-config:/ollama-config   # shared with world — see docs/DEPLOYMENT.md and the entrypoint below
    # entrypoint/command together run this as `sh -c "<script>"` so a shell can
    # source ollama.env (if nd-world has ever saved one — see the volume and
    # comment above) into this process's environment before ollama itself
    # starts, then stamp a copy as ollama.env.applied so nd-world's Settings
    # page can honestly report whether a restart is still pending. `set -a`
    # makes every `KEY=value` line the file sources behave as if it were
    # `export KEY=value`, since ollama.env itself contains plain assignments
    # (see app/ollama_tuning.py's render_env_file). `exec` at the end so
    # ollama (not the shell) is PID 1 and gets signals directly — otherwise
    # `docker compose stop`/restart would wait out the shell's term-signal
    # grace period instead of stopping ollama right away. This is ONE
    # `command:` list item, not a bare scalar string (word-splitting caution).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /ollama-config &&
        if [ -f /ollama-config/ollama.env ]; then set -a; . /ollama-config/ollama.env; set +a; fi &&
        cp -f /ollama-config/ollama.env /ollama-config/ollama.env.applied 2>/dev/null ||
        printf '# nd-world has not saved any server tuning yet.\n' > /ollama-config/ollama.env.applied;
        exec ollama serve
    # To pull a model after first start:
    #   docker compose exec ollama ollama pull gemma4:26b
    # For an NVIDIA GPU: docker-compose.gpu.yml in this repo is a ready
    # override (docker compose -f docker-compose.yml -f docker-compose.gpu.yml
    # up -d), or uncomment the deploy block below. Full walkthrough,
    # including V100/Volta specifics: docs/GPU_SETUP.md
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # For an AMD GPU (ROCm) — e.g. an RX 9070 XT — uncomment this instead.
    # Requires the host to have ROCm-capable kernel drivers installed; the
    # container itself needs no ROCm install since ollama/ollama's default
    # image already bundles ROCm support.
    # devices:
    #   - /dev/kfd
    #   - /dev/dri
    # group_add:
    #   - video
    #   - render

  # Optional: Unsloth Studio — the single AI backend for chat, embeddings
  # and image generation (see docs/UNSLOTH_PHASE0_FINDINGS.md for the
  # verified API surface this app talks to). Replaces the "ollama" and
  # "swarmui" services once cut over. Only starts if the "unsloth" profile
  # is active — set COMPOSE_PROFILES=unsloth (or unsloth,android) in .env.
  #
  # One-time provisioning after first start (see docs/DEPLOYMENT.md):
  #   1. Open Studio at http://localhost:8000 and sign in (password from
  #      UNSLOTH_STUDIO_PASSWORD below).
  #   2. Settings → API → create a key named "nd-world" → paste into .env
  #      as UNSLOTH_API_KEY. NOTE: keys do NOT survive container recreation
  #      (they do survive `docker restart`) — after any container
  #      recreation, re-create the key and update .env.
  #   3. Settings → API → enable "Model auto-switch" (and media auto-switch)
  #      so requesting a downloaded model by name loads it on demand; set
  #      idle auto-unload (e.g. 300 s) on a single-GPU box.
  #      Also set the chat model's context length in Studio to the SAME number
  #      as LLM_CONTEXT_TOKENS (default 16384): llama.cpp fixes context at model
  #      load, and nd-world sizes its prompts from LLM_CONTEXT_TOKENS — if they
  #      differ, long prompts overflow or waste the window (the AI page's status
  #      card flags a mismatch).
  #   4. Download models in the Model Hub — the chat GGUF (default below:
  #      gemma-4-26B UD-IQ4_NL) and an image model (Krea 2 Turbo or
  #      Z-Image-Turbo). V100: set Precision fp16, non-flash attention,
  #      Low VRAM for image models — and check docs/UNSLOTH_PHASE0_FINDINGS.md
  #      I-7 FIRST: recent images may lack sm_70 kernels, in which case pin
  #      an older unsloth image tag here.
  unsloth:
    profiles: ["unsloth"]
    # :latest is a MOVING tag — every pull can change Studio's API (this app's
    # /api/* calls track Studio's own, not a stable contract) and the image
    # can lose kernels (sm_70/V100: see docs/GPU_SETUP.md §2). Once a version
    # works for you, pin it: UNSLOTH_IMAGE=unsloth/unsloth:<tag> in .env.
    image: ${UNSLOTH_IMAGE:-unsloth/unsloth:latest}   # sm_75+ (Turing T4/T10 and newer): :latest is fine; V100 owners pin an older tag
    container_name: nd-world-unsloth
    restart: unless-stopped
    stop_grace_period: 60s               # model unload can be slow
    ipc: host                            # required per Unsloth's own docker docs
    ports:
      # Studio UI + /v1 API on one port. Loopback by default: nd-world reaches
      # it over the compose network (http://unsloth:8000), not this mapping, and
      # the UI is a model-management console. UNSLOTH_BIND=0.0.0.0 to open it
      # to the LAN (then set a strong UNSLOTH_STUDIO_PASSWORD).
      - "${UNSLOTH_BIND:-127.0.0.1}:8000:8000"
    environment:
      UNSLOTH_STUDIO_PASSWORD: ${UNSLOTH_STUDIO_PASSWORD:?set in .env}
      # Do NOT set HF_TOKEN here unless needed for gated models; prefer Studio Settings.
    volumes:
      # Same parent directory as ollama's/swarmui's model volumes above — see
      # AI_MODELS_DIR.
      - ${AI_MODELS_DIR:-./ai-models}/unsloth/studio:/opt/unsloth-studio
      - ${AI_MODELS_DIR:-./ai-models}/unsloth/hf-cache:/workspace/.cache/huggingface
      - ${AI_MODELS_DIR:-./ai-models}/unsloth/host:/workspace/host
    # NVIDIA GPU — for Compose v2 this deploy block is enough; for older
    # docker-compose v1 also install the nvidia container toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Optional: local AI image generation. Only starts if the "swarmui" profile is
  # active — set COMPOSE_PROFILES=swarmui (or ollama,swarmui) in .env, or run
  # `docker compose --profile swarmui up -d`.
  swarmui:
    profiles: ["swarmui"]
    image: ghcr.io/mcmonkeyprojects/swarmui:latest
    container_name: swarmui
    restart: unless-stopped
    ports:
      - "7801:7801"
    volumes:
      - swarmui-data:/SwarmUI/Data
      - swarmui-ac:/SwarmUI/Data/Autocompletions   # shared with world for tag autocompletions
      # Same parent directory as ollama's model volume above — see AI_MODELS_DIR.
      - ${AI_MODELS_DIR:-./ai-models}/swarmui:/SwarmUI/Models
      - swarmui-dlbackend:/SwarmUI/dlbackend
    environment:
      SWARMUI_NETWORK_BIND_ADDRESS: "0.0.0.0"
      SWARMUI_NETWORK_PORT: "7801"

  # Optional: embed the real NeonDragonsApp Android UI inside nd-world (see
  # /androidapp) via a self-hosted emulator + noVNC web viewer, instead of
  # requiring the APK to be installed on a player's own device. Only starts
  # if the "android" profile is active — set COMPOSE_PROFILES=android (or
  # add it to your existing list) in .env, or run
  # `docker compose --profile android up -d`.
  #
  # Requirements this doesn't check for you: an x86_64 host, /dev/kvm
  # available (huge performance difference without it — see
  # docs/DEPLOYMENT.md), and a few GB of free RAM. Does NOT run acceptably
  # on typical ARM-based NAS/SBC hardware.
  #
  # budtmo/docker-android bundles the emulator + a noVNC web viewer on port
  # 6080 in one image, so there's no separate VNC/websocket bridge to wire
  # up — see https://github.com/budtmo/docker-android for the full set of
  # tunable EMULATOR_*/WEB_VNC env vars and device/API-level image tags.
  android:
    profiles: ["android"]
    image: budtmo/docker-android:emulator_11.0
    container_name: nd-world-android
    restart: unless-stopped
    privileged: true   # required by the image to run the emulator (KVM/binder access)
    devices:
      - /dev/kvm
    ports:
      - "${ANDROID_VNC_PORT:-6080}:6080"
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
    volumes:
      - android-apk:/apk   # drop the CI-built debug APK here — see scripts/android-provision.sh

  # Optional: embed the real NeonDragonsEditor desktop app inside nd-world
  # (see /editor) via a containerized Xvfb/noVNC session, so a GM can build
  # races/professions/feats/items from any browser without installing
  # Python/Qt locally. Only starts if the "editor" profile is active — set
  # COMPOSE_PROFILES=editor (or add it to your existing list) in .env, or
  # run `docker compose --profile editor up -d`.
  #
  # This is a first-pass, unverified container (no CI coverage) — expect to
  # need some iteration, especially around the QtWebEngine-dependent tabs
  # (HTML sheet preview, city map). See docs/DEPLOYMENT.md.
  #
  # The editor-repo volume should point at a checkout of the content
  # markdown (the "character creation/"/"equipment/"/"lore/" trees) so
  # `--portable` skips the first-run folder picker. The editor has no git
  # integration — use Part 2's "Export to nd-world..." as the primary save
  # path; treat this volume as a working copy, not the source of truth.
  editor:
    profiles: ["editor"]
    build: ./NeonDragonsEditor
    image: nd-editor:latest
    container_name: nd-world-editor
    restart: unless-stopped
    ports:
      - "${EDITOR_VNC_PORT:-6081}:6080"
    volumes:
      - editor-config:/root/NeonDragonsEditor   # config.json + window state
      - editor-repo:/data/rulebook              # content markdown checkout

volumes:
  nd-world-data:
    driver: local
  ollama-config:
    driver: local
  swarmui-data:
    driver: local
  swarmui-ac:
    driver: local
  swarmui-dlbackend:
    driver: local
  android-apk:
    driver: local
  editor-config:
    driver: local
  editor-repo:
    driver: local
